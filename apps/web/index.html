<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Instances hold private documents; the public face for search engines is aldine.dev. -->
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#1c1c1e" />
    <!-- The product name: src/product.ts PRODUCT_NAME (src/__tests__/product.test.ts checks it) -->
    <title>Laytekz</title>
    <!-- Galley: V2 (WP45) what link previews and app installs show. Always generic: previews of /p/<id>
         are fetched signed out, so no project name ever appears here. The server adds absolute
         og:url and og:image when ALDINE_PUBLIC_URL is set (http-headers.ts stampShell). -->
    <meta name="description" content="Laytekz is a collaborative LaTeX editor: write together, see the PDF update as you type, and keep every version." />
    <meta property="og:site_name" content="Laytekz" />
    <meta property="og:title" content="Laytekz" />
    <meta property="og:description" content="A collaborative LaTeX editor with a live PDF preview." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <!-- Apply the appearance before first paint. A stored light or dark choice
         wins; anything else follows the operating system. Mirrors theme.ts.
         Galley: also the interface text size, contrast and motion settings
         (V2; settings/apply.ts keeps them afterwards, core.ts lists the sizes). -->
    <script data-prepaint>
      (function () {
        var s = null;
        try { s = window.localStorage; } catch (e) {}
        function get(k) { try { return s ? s.getItem(k) : null; } catch (e) { return null; } }
        function json(k) { var v = get(k); if (v === null) return null; try { return JSON.parse(v); } catch (e) { return null; } }
        var root = document.documentElement;
        var a = get('aldine.theme');
        var t = 'dark';
        if (a === 'light') t = 'light';
        else if (a !== 'dark') {
          try { t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) {}
        }
        root.dataset.theme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'light' ? '#f5f5f7' : '#1c1c1e');
        var z = json('aldine.appearance.scale');
        if (z === 90 || z === 110 || z === 125) root.style.fontSize = z + '%';
        if (json('aldine.appearance.contrast') === 'more') root.dataset.contrast = 'more';
        if (json('aldine.appearance.motion') === 'reduce') root.dataset.motion = 'reduce';
      })();
    </script>
    <!-- The product's mark, drawn as in src/components/LogoMark.tsx -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='3 3 26 26'><rect x='3.125' y='3.125' width='25.75' height='25.75' rx='6' fill='%232a2c32'/><path d='M10 28.875V6a.75.75 0 0 1 .75-.75h10.5A.75.75 0 0 1 22 6v22.875Z' fill='%23f6f3ec'/><g fill='%2333363d'><rect x='12' y='8' width='8' height='2' rx='.6'/><rect x='12' y='12' width='4' height='2' rx='.6'/><rect x='18' y='12' width='2' height='2' rx='.6'/><rect x='14' y='20' width='6' height='2' rx='.6'/><rect x='12' y='24' width='8' height='2' rx='.6'/></g><path d='M14.6 18.2 17 15.2l2.4 3' fill='none' stroke='%23ef4a3a' stroke-width='1.7' stroke-linecap='round'/><rect x='3.5' y='3.5' width='25' height='25' rx='5.6' fill='none' stroke='%23fff' stroke-opacity='.14' stroke-width='.75'/></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Galley: V2 (WP45) readers without JavaScript (link previews, Google's brand check) get the basics. -->
    <noscript>
      <p style="max-width:34rem;margin:48px auto;padding:0 16px;font:15px/1.5 system-ui,sans-serif">Laytekz is a collaborative LaTeX editor with a live PDF preview. It needs JavaScript. <a href="./about">About this site</a> · <a href="./privacy">Privacy</a></p>
    </noscript>
    <!-- Galley: V2 (WP45) the browsers the app really needs (pdf.js calls Promise.withResolvers; the CSS uses
         :has() and color-mix()): Chrome or Edge 119, Firefox 121, Safari 17.4. Below that a notice explains,
         and main.tsx mounts the app only after "Continue anyway". The server's CSP hashes this script. -->
    <script data-browser-check>
      (function () {
        var ok = false;
        try {
          ok = typeof Promise.withResolvers === 'function' && !!(window.CSS && CSS.supports
            && CSS.supports('selector(:has(a))') && CSS.supports('color', 'color-mix(in srgb, red, blue)'));
        } catch (e) {}
        if (ok) return;
        window.__laytekzUnsupported = true;
        var d = document.createElement('div');
        d.setAttribute('role', 'alert');
        d.setAttribute('data-testid', 'unsupported-browser');
        d.style.cssText = 'position:fixed;left:16px;right:16px;top:16px;z-index:400;max-width:34rem;margin:0 auto;padding:16px 20px;border-radius:10px;background:#2a2c32;color:#f6f3ec;font:15px/1.5 system-ui,-apple-system,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.3)';
        d.innerHTML = '<p style="margin:0 0 12px">Laytekz needs a newer browser: Chrome or Edge 119 or later, Firefox 121 or later, or Safari 17.4 or later. In this one, parts such as the PDF preview will not work. You can also use the Laytekz desktop app.</p>'
          + '<button type="button" data-testid="unsupported-continue" style="font:inherit;font-weight:600;padding:6px 14px;border:0;border-radius:8px;background:#f6f3ec;color:#2a2c32;cursor:pointer">Continue anyway</button>';
        document.body.appendChild(d);
        d.querySelector('button').onclick = function () {
          d.parentNode.removeChild(d);
          window.__laytekzUnsupported = false;
          if (typeof window.__laytekzMount === 'function') window.__laytekzMount();
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
