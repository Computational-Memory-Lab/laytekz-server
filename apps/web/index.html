<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Instances hold private documents; the public face for search engines is aldine.dev. -->
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#1c1c1e" />
    <!-- The product name: src/product.ts PRODUCT_NAME (src/__tests__/product.test.ts checks it) -->
    <title>Laytekz</title>
    <!-- Apply the appearance before first paint. A stored light or dark choice
         wins; anything else follows the operating system. Mirrors theme.ts. -->
    <script data-prepaint>
      (function () {
        var a = null;
        try { a = window.localStorage.getItem('aldine.theme'); } catch (e) {}
        var t = 'dark';
        if (a === 'light') t = 'light';
        else if (a !== 'dark') {
          try { t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) {}
        }
        document.documentElement.dataset.theme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'light' ? '#f5f5f7' : '#1c1c1e');
      })();
    </script>
    <!-- The product's mark, drawn as in src/components/LogoMark.tsx -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='3 3 26 26'><rect x='3.125' y='3.125' width='25.75' height='25.75' rx='6' fill='%232a2c32'/><path d='M10 28.875V6a.75.75 0 0 1 .75-.75h10.5A.75.75 0 0 1 22 6v22.875Z' fill='%23f6f3ec'/><g fill='%2333363d'><rect x='12' y='8' width='8' height='2' rx='.6'/><rect x='12' y='12' width='4' height='2' rx='.6'/><rect x='18' y='12' width='2' height='2' rx='.6'/><rect x='14' y='20' width='6' height='2' rx='.6'/><rect x='12' y='24' width='8' height='2' rx='.6'/></g><path d='M14.6 18.2 17 15.2l2.4 3' fill='none' stroke='%23ef4a3a' stroke-width='1.7' stroke-linecap='round'/><rect x='3.5' y='3.5' width='25' height='25' rx='5.6' fill='none' stroke='%23fff' stroke-opacity='.14' stroke-width='.75'/></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
